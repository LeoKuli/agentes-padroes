name: teste-padroes

# CI do próprio repositório padroes: testes do verificador de escopo e validade dos modelos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Rodar os testes
        run: python -m pytest -q
      - name: Sintaxe do script de rótulos
        run: bash -n scripts/aplicar-labels.sh
